<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
<title id="title">Deep Learning — Pre and Post-Monsoon Groundwater Prediction</title>
<desc id="desc">A modern purple artificial-intelligence banner with a friendly research robot, neural-network panels, groundwater time-series charts, and clear project typography for four independent seasonal groundwater datasets.</desc>
<style>
#robot-motion { animation: robotFloat 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
#floating-cards { animation: cardFloat 5.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes robotFloat { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
@keyframes cardFloat { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#18065a"/>
    <stop offset=".48" stop-color="#3a0a91"/>
    <stop offset="1" stop-color="#090b3d"/>
  </linearGradient>
  <linearGradient id="rightGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4512a4" stop-opacity="0"/>
    <stop offset=".55" stop-color="#6718c9" stop-opacity=".32"/>
    <stop offset="1" stop-color="#16c7ed" stop-opacity=".12"/>
  </linearGradient>
  <linearGradient id="robotBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0eaff"/>
    <stop offset=".52" stop-color="#b9a4ff"/>
    <stop offset="1" stop-color="#7653e8"/>
  </linearGradient>
  <linearGradient id="robotSide" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a98bff"/>
    <stop offset="1" stop-color="#5734bd"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#20e6e8"/>
    <stop offset="1" stop-color="#58baff"/>
  </linearGradient>
  <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6a7ff"/>
    <stop offset="1" stop-color="#8d6bff"/>
  </linearGradient>
  <radialGradient id="platformGlow">
    <stop offset="0" stop-color="#1de6ef" stop-opacity=".45"/>
    <stop offset="1" stop-color="#1de6ef" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#c4b5fd" stroke-opacity=".07" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.5" fill="#c4b5fd" opacity=".16"/>
  </pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
    <feOffset dy="9" result="offset"/>
    <feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect width="1600" height="560" rx="28"/></clipPath>
</defs>

<g clip-path="url(#clip)">
  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#grid)"/>
  <rect width="1600" height="560" fill="url(#rightGlow)"/>
  <circle cx="360" cy="290" r="300" fill="#7c3aed" opacity=".13"/>
  <circle cx="1320" cy="240" r="350" fill="#1d4ed8" opacity=".10"/>

  <!-- Abstract neural circuitry in the background -->
  <g fill="none" stroke="#a78bfa" stroke-opacity=".22" stroke-width="2">
    <path d="M0 105H110L148 143H245M0 145H78L122 190H220"/>
    <path d="M0 420H120L166 374H245M20 460H100L150 410H220"/>
    <path d="M1260 48H1375L1410 83H1600M1310 95H1430L1470 135H1600"/>
    <path d="M1270 500H1380L1420 460H1600M1330 455H1430L1480 405H1600"/>
  </g>
  <g fill="#bda8ff" opacity=".62">
    <circle cx="110" cy="105" r="4"/><circle cx="245" cy="143" r="4"/><circle cx="78" cy="145" r="3"/>
    <circle cx="220" cy="190" r="4"/><circle cx="120" cy="420" r="4"/><circle cx="245" cy="374" r="4"/>
    <circle cx="1375" cy="48" r="4"/><circle cx="1600" cy="83" r="4"/><circle cx="1380" cy="500" r="4"/>
  </g>

  <!-- Left-side research illustration: holographic AI pedestal -->
  <ellipse cx="390" cy="475" rx="260" ry="62" fill="url(#platformGlow)"/>
  <g fill="none" stroke="#18dce8" stroke-width="4" opacity=".72">
    <ellipse cx="390" cy="455" rx="180" ry="28">
      <animate attributeName="opacity" values=".35;.95;.35" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="390" cy="455" rx="145" ry="20" opacity=".7"/>
    <ellipse cx="390" cy="455" rx="108" ry="13" opacity=".5"/>
  </g>
  <g fill="none" stroke="#39e8ef" stroke-width="3" opacity=".65">
    <path d="M265 445Q390 485 515 445"><animate attributeName="opacity" values=".3;.9;.3" dur="3.8s" repeatCount="indefinite"/></path>
    <path d="M285 465Q390 493 495 465"><animate attributeName="opacity" values=".8;.25;.8" dur="3.8s" repeatCount="indefinite"/></path>
  </g>

  <!-- Animated model-output cards -->
  <g id="floating-cards" transform="translate(0 0)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -7;0 0" dur="5.2s" repeatCount="indefinite"/>
  <!-- Small floating model-output cards -->
  <g filter="url(#shadow)">
    <g transform="translate(70 150)">
      <rect width="150" height="104" rx="13" fill="#21116c" stroke="#8c7aff" stroke-opacity=".85"/>
      <rect x="12" y="13" width="126" height="78" rx="8" fill="#100d4c"/>
      <path d="M23 70L42 58L57 63L77 35L96 48L124 25" fill="none" stroke="#20e6e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M23 76H128" stroke="#a78bfa" stroke-opacity=".35"/>
      <circle cx="77" cy="35" r="4" fill="#fff" filter="url(#glow)"/>
    </g>
    <g transform="translate(555 160)">
      <rect width="156" height="112" rx="13" fill="#261078" stroke="#9c8cff" stroke-opacity=".85"/>
      <rect x="12" y="13" width="132" height="86" rx="8" fill="#111052"/>
      <g fill="#7661ef">
        <rect x="24" y="61" width="13" height="25" rx="3"/><rect x="45" y="48" width="13" height="38" rx="3"/>
        <rect x="66" y="34" width="13" height="52" rx="3"/><rect x="87" y="54" width="13" height="32" rx="3"/>
        <rect x="108" y="26" width="13" height="60" rx="3"/>
      </g>
      <path d="M23 88H132" stroke="#b9adff" stroke-opacity=".45"/>
    </g>
    <g transform="translate(565 305)">
      <rect width="145" height="95" rx="13" fill="#25106f" stroke="#8c7aff" stroke-opacity=".85"/>
      <rect x="11" y="12" width="123" height="70" rx="8" fill="#100d4b"/>
      <g fill="#1de0e6">
        <circle cx="38" cy="35" r="8"/><circle cx="69" cy="35" r="8"/><circle cx="100" cy="35" r="8"/>
        <circle cx="38" cy="62" r="8"/><circle cx="69" cy="62" r="8"/><circle cx="100" cy="62" r="8"/>
      </g>
      <g fill="#d7c9ff"><circle cx="38" cy="35" r="3"/><circle cx="69" cy="35" r="3"/><circle cx="100" cy="35" r="3"/></g>
    </g>
  </g>

  </g>
  <!-- Neural links between cards and robot -->
  <g fill="none" stroke="#55e8ef" stroke-width="2" stroke-dasharray="5 8" opacity=".65">
    <path d="M220 203C260 203 250 250 292 250"/>
    <path d="M555 210C525 210 540 245 510 245"/>
    <path d="M565 350C530 350 530 330 510 330"/>
  </g>
  <g fill="#5df4f2" filter="url(#glow)">
    <circle cx="254" cy="203" r="4"/><circle cx="535" cy="210" r="4"/><circle cx="535" cy="350" r="4"/>
  </g>

  <g id="robot-motion" transform="translate(0 0)">
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -10;0 0" dur="3.8s" repeatCount="indefinite"/>
  <!-- Robot arm behind body -->
  <g filter="url(#shadow)">
    <path d="M475 275Q520 245 540 210" fill="none" stroke="#6f55df" stroke-width="26" stroke-linecap="round"/>
    <path d="M475 275Q520 245 540 210" fill="none" stroke="#c7b7ff" stroke-width="13" stroke-linecap="round"/>
    <circle cx="475" cy="275" r="18" fill="#7859e6" stroke="#d9ceff" stroke-width="4"/>
    <circle cx="540" cy="210" r="13" fill="#a18aff" stroke="#e0d7ff" stroke-width="3"/>
    <path d="M540 210L555 192M540 210L561 216" stroke="#bdaeff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Robot legs -->
  <g filter="url(#shadow)">
    <path d="M340 385L332 426M438 385L447 426" stroke="#9c83f7" stroke-width="22" stroke-linecap="round"/>
    <path d="M315 429Q333 420 350 432L349 448H310Z" fill="#d4caff"/>
    <path d="M429 432Q447 420 463 430L472 448H430Z" fill="#d4caff"/>
  </g>

  <!-- Main friendly AI robot -->
  <g filter="url(#shadow)">
    <!-- antenna -->
    <path d="M389 108V78" stroke="#c5b5ff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="389" cy="68" r="13" fill="#21e5ec" filter="url(#glow)"/>
    <!-- head -->
    <rect x="285" y="105" width="210" height="135" rx="48" fill="url(#robotBody)" stroke="#e9e2ff" stroke-width="4"/>
    <rect x="304" y="130" width="172" height="84" rx="27" fill="#24136e" stroke="#9d8aff" stroke-width="3"/>
    <g fill="#35eff0" filter="url(#glow)">
      <ellipse cx="350" cy="170" rx="13" ry="18"/>
      <ellipse cx="430" cy="170" rx="13" ry="18"/>
    </g>
    <path d="M366 198Q390 210 414 198" fill="none" stroke="#a99bff" stroke-width="4" stroke-linecap="round"/>
    <!-- ear plates -->
    <rect x="270" y="150" width="20" height="55" rx="9" fill="#8469e9"/>
    <rect x="490" y="150" width="20" height="55" rx="9" fill="#8469e9"/>
    <!-- torso -->
    <rect x="300" y="246" width="180" height="150" rx="30" fill="url(#robotBody)" stroke="#e6deff" stroke-width="4"/>
    <rect x="330" y="276" width="120" height="76" rx="12" fill="#1b155d" stroke="#8c7cff" stroke-width="3"/>
    <rect x="343" y="289" width="94" height="50" rx="6" fill="#0a194d"/>
    <path d="M352 323L365 311L378 317L394 298L411 307L427 294" fill="none" stroke="#29e5e9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="394" cy="298" r="4" fill="#fff" filter="url(#glow)"/>
    <circle cx="390" cy="370" r="7" fill="#7657e8"/>
    <!-- left arm -->
    <path d="M301 274Q270 285 257 316" fill="none" stroke="#a58fff" stroke-width="21" stroke-linecap="round"/>
    <circle cx="257" cy="316" r="14" fill="#8065e8" stroke="#d9ceff" stroke-width="3"/>
    <path d="M257 328L245 351M257 328L268 350M257 328L257 356" stroke="#c8baff" stroke-width="7" stroke-linecap="round"/>
  </g>

  </g>
  <!-- Floating mini data sparks -->
  <g fill="#80f6f3" filter="url(#glow)">
    <circle cx="260" cy="95" r="3"/><circle cx="530" cy="120" r="3"/><circle cx="520" cy="400" r="2.5"/>
    <circle cx="230" cy="380" r="2.5"/><circle cx="620" cy="130" r="2"/>
  </g>

  <!-- Right side: large, clean, readable project typography -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(805 84)">
      <path d="M0 0H180M0 0H0" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round"/>
      <g fill="#8d78ff">
        <rect x="202" y="-6" width="9" height="12" rx="4"/><rect x="218" y="-6" width="9" height="12" rx="4"/>
        <rect x="234" y="-6" width="9" height="12" rx="4"/><rect x="250" y="-6" width="9" height="12" rx="4"/>
        <rect x="266" y="-6" width="9" height="12" rx="4"/>
      </g>
      <g fill="#20e6e8">
        <rect x="186" y="-8" width="9" height="16" rx="4"/><rect x="170" y="-8" width="9" height="16" rx="4"/>
      </g>
      <path d="M300 0H505" stroke="url(#cyan)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#20e6e8"/><circle cx="505" cy="0" r="4" fill="#20e6e8"/>
    </g>

    <text x="1080" y="198" text-anchor="middle" fill="#ffffff" font-size="67" font-weight="900" letter-spacing="-1.5">DEEP LEARNING</text>
    <text x="1080" y="266" text-anchor="middle" fill="url(#cyan)" font-size="58" font-weight="900" letter-spacing="-1.5">GROUNDWATER</text>
    <text x="1080" y="320" text-anchor="middle" fill="#d9ccff" font-size="35" font-weight="800" letter-spacing="1">PRE &amp; POST-MONSOON</text>
    <text x="1080" y="366" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="650" letter-spacing=".5">SEASONAL LEVEL PREDICTION</text>

    <text x="1080" y="414" text-anchor="middle" fill="#d9d5ff" font-size="17" font-weight="500">
      Four independent datasets • 1994–2024
    </text>
    <text x="1080" y="442" text-anchor="middle" fill="#d9d5ff" font-size="17" font-weight="500">
      Spatial-temporal features • Chronological evaluation
    </text>

    <!-- Model tags -->
    <g transform="translate(812 474)" font-size="16" font-weight="800" letter-spacing=".8">
      <rect width="116" height="42" rx="21" fill="#2a1a80" stroke="#8e7aff" stroke-opacity=".9"/>
      <text x="58" y="27" text-anchor="middle" fill="#f4f0ff">LSTM</text>
      <rect x="128" width="116" height="42" rx="21" fill="#2a1a80" stroke="#8e7aff" stroke-opacity=".9"/>
      <text x="186" y="27" text-anchor="middle" fill="#f4f0ff">GRU</text>
      <rect x="256" width="142" height="42" rx="21" fill="#2a1a80" stroke="#8e7aff" stroke-opacity=".9"/>
      <text x="327" y="27" text-anchor="middle" fill="#f4f0ff">CNN-LSTM</text>
      <rect x="410" width="190" height="42" rx="21" fill="#2a1a80" stroke="#8e7aff" stroke-opacity=".9"/>
      <text x="505" y="27" text-anchor="middle" fill="#f4f0ff">HYBRID LSTM-GRU</text>
    </g>

    <g transform="translate(805 540)">
      <path d="M0 0H180" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round"/>
      <g fill="#8d78ff">
        <rect x="202" y="-5" width="9" height="10" rx="4"/><rect x="218" y="-5" width="9" height="10" rx="4"/>
        <rect x="234" y="-5" width="9" height="10" rx="4"/><rect x="250" y="-5" width="9" height="10" rx="4"/>
        <rect x="266" y="-5" width="9" height="10" rx="4"/>
      </g>
      <g fill="#20e6e8"><rect x="186" y="-7" width="9" height="14" rx="4"/><rect x="170" y="-7" width="9" height="14" rx="4"/></g>
      <path d="M300 0H795" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="#20e6e8"/><circle cx="795" cy="0" r="4" fill="#20e6e8"/>
    </g>
  </g>

  <!-- Soft animated data pulses -->
  <g fill="#62f2f1">
    <circle cx="750" cy="165" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="205" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="390" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="2" y="2" width="1596" height="556" rx="26" fill="none" stroke="#d9ccff" stroke-opacity=".5" stroke-width="2"/>
</g>
</svg>